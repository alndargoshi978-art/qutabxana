<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خشتەی ڕۆژانە - ئامادەیی بەدرخانی کوڕان</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { min-height: 100vh; background: linear-gradient(rgba(15, 30, 40, 0.75), rgba(10, 20, 30, 0.85)), url('school.jpg'); background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; color: white; }
        
        nav { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 10px 15px; border-radius: 16px; max-width: 700px; margin: 10px auto; width: 100%; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); }
        nav a { color: white; text-decoration: none; padding: 6px 15px; border-radius: 10px; font-weight: 500; font-size: 13px; transition: all 0.3s ease; }
        nav a:hover, nav a.active { background: rgba(255, 255, 255, 0.25); color: #38bdf8; }

        .main-container { max-width: 1000px; width: 100%; margin: auto; padding: 10px 0; }
        .glass-card { background: rgba(20, 50, 65, 0.65); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 25px 20px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); text-align: center; }
        .glass-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; color: #38bdf8; }
        
        .admin-box { background: rgba(255, 255, 255, 0.08); padding: 15px; border-radius: 15px; margin-bottom: 25px; border: 1px dashed rgba(255, 255, 255, 0.3); text-align: right; }
        .admin-box h3 { font-size: 14px; margin-bottom: 10px; color: #fff; }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 10px; }
        
        .admin-box input, .admin-box select { width: 100%; padding: 10px; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; color: white; font-size: 13px; outline: none; }
        .admin-box select option { background: #0f172a; color: white; }
        .admin-box input::placeholder { color: #cbd5e1; }
        
        .add-btn { background: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; font-size: 14px; transition: 0.3s; margin-top: 5px; }
        .add-btn:hover { background: #0ea5e9; color: white; }

        .info-box { background: rgba(14, 165, 233, 0.15); border: 1px solid rgba(14, 165, 233, 0.4); padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        
        .days-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 15px; }
        .day-box { background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 15px; padding: 15px; text-align: right; }
        .day-box h3 { color: #38bdf8; font-size: 16px; margin-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 5px; }
        
        .lesson-item { background: rgba(0, 0, 0, 0.2); padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .lesson-info { display: flex; flex-direction: column; gap: 2px; }
        .lesson-time { font-size: 11px; color: #38bdf8; font-weight: bold; }
        
        .delete-btn { background: rgba(239, 68, 68, 0.8); color: white; border: none; padding: 3px 8px; border-radius: 5px; font-size: 11px; cursor: pointer; }
        .delete-btn:hover { background: #dc2626; }
        footer { text-align: center; padding: 10px; font-size: 12px; color: #cbd5e1; }
        @media (min-width: 600px) { .form-grid { grid-template-columns: repeat(2, 1fr); } .days-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 900px) { .days-grid { grid-template-columns: repeat(3, 1fr); } }
    </style>
</head>
<body>

    <nav>
        <a href="page1.html">سەرەکی</a>
        <a href="page2.html">ئاگادارییەکان</a>
        <a href="page3.html" class="active">خشتەی ڕۆژانە</a>
        <a href="page4.html">نمرەکان</a>
        <a href="page5.html">داواکارییەکان</a>
        <a href="index.html" onclick="logoutUser()" style="background: rgba(239, 68, 68, 0.3); color: #f87171;">چوونە دەرەوە</a>
    </nav>

    <div class="main-container">
        <div class="glass-card">
            
            <div class="info-box">
                <h1 id="pageTitle">خشتەی ڕۆژانەی دەوام</h1>
                <p id="subTitle" style="font-size: 14px; color: #cbd5e1;">خشتەی فەرمی دەوامی خوێندن بەپێی بۆکس و کاتی دڵخواز</p>
            </div>

            <!-- بەشی زیادکردنی خشتە بۆ بەڕێوەبەر -->
            <div class="admin-box" id="adminScheduleBox" style="display: none;">
                <h3>➕ زیادکردنی وانە بۆ ڕۆژێک (بە کات و پۆل و لقی دڵخواز)</h3>
                <div class="form-grid">
                    <select id="scheduleGrade">
                        <option value="پۆلی 10 (زانستی)">پۆلی 10 زانستی</option>
                        <option value="پۆلی 10 (وێژەیی)">پۆلی 10 وێژەیی</option>
                        <option value="پۆلی 11 (زانستی)">پۆلی 11 زانستی</option>
                        <option value="پۆلی 11 (وێژەیی)">پۆلی 11 وێژەیی</option>
                        <option value="پۆلی 12 (زانستی)">پۆلی 12 زانستی</option>
                        <option value="پۆلی 12 (وێژەیی)">پۆلی 12 وێژەیی</option>
                    </select>
                    <select id="scheduleSection">
                        <option value="لقی أ">لقی أ</option>
                        <option value="لقی ب">لقی ب</option>
                        <option value="لقی ج">لقی ج</option>
                        <option value="لقی د">لقی د</option>
                    </select>
                    <select id="scheduleDay">
                        <option value="شەممە">شەممە</option>
                        <option value="یەکشەممە">یەکشەممە</option>
                        <option value="دووشەممە">دووشەممە</option>
                        <option value="سێشەممە">سێشەممە</option>
                        <option value="چوارشەممە">چوارشەممە</option>
                        <option value="پێنجشەممە">پێنجشەممە</option>
                    </select>
                    <input type="text" id="scheduleTime" placeholder="کاتی دڵخواز بنووسە (بۆ نموونە: 08:30 - 09:15)">
                    <input type="text" id="scheduleSubject" placeholder="ناوی بابەت (بۆ نموونە: بیرکاری)">
                    <input type="text" id="scheduleTeacher" placeholder="ناوی مامۆستا (بۆ نموونە: م. عەلی)">
                </div>
                <button class="add-btn" onclick="addBoxScheduleItem()">زیادکردنی وانە بۆ بۆکسی ڕۆژ</button>
            </div>

            <!-- بۆکسەکانی ڕۆژانی هەفتە -->
            <div class="days-grid" id="daysContainer">
                <!-- زانیارییەکان لێرە دەردەکەون -->
            </div>
        </div>
    </div>

    <footer>
        <p>مافی پارێزراوە &copy; 2026 ئامادەیی بەدرخانی کوڕان</p>
    </footer>

    <script>
        function logoutUser() {
            localStorage.removeItem('currentUserRole');
            localStorage.removeItem('studentGrade');
            localStorage.removeItem('studentSection');
        }

        window.onload = function() {
            let role = localStorage.getItem('currentUserRole');
            if (role === 'admin') {
                document.getElementById('adminScheduleBox').style.display = 'block';
                document.getElementById('pageTitleinnerText').innerText = "بەڕێوەبردنی خشتەی ڕۆژانەی پۆلەکان";
                document.getElementById('pageTitle').innerText = "بەڕێوەبردنی خشتەی ڕۆژانەی پۆلەکان";
                document.getElementById('subTitle').innerText = "دەتوانیت بۆ هەر پۆل و لقێک بە کاتی دڵخواز وانەکان زیاد بکەیت";
                loadScheduleBoxes("پۆلی 12 (زانستی)", "لقی أ");
            } else if (role === 'student') {
                let myGrade = localStorage.getItem('studentGrade');
                let mySection = localStorage.getItem('studentSection');
                document.getElementById('pageTitle').innerText = "خشتەی دەوامی پۆلەکەت";
                document.getElementById('subTitle').innerText = `${myGrade} - ${mySection}`;
                loadScheduleBoxes(myGrade, mySection);
            } else if (role === 'teacher') {
                document.getElementById('pageTitle').innerText = "خشتەی دەوامی مامۆستا";
                document.getElementById('subTitle').innerText = "سەرجەم ئەو وانانەی بەپێی کات و ڕۆژەکان دەیدەیتەوە";
                loadScheduleBoxesForTeacher();
            }
        }

        function addBoxScheduleItem() {
            let grade = document.getElementById('scheduleGrade').value;
            let section = document.getElementById('scheduleSection').value;
            let day = document.getElementById('scheduleDay').value;
            let time = document.getElementById('scheduleTime').value.trim();
            let subject = document.getElementById('scheduleSubject').value.trim();
            let teacher = document.getElementById('scheduleTeacher').value.trim();

            if (!time || !subject || !teacher) {
                alert('تکایە خانەکانی (کات، بابەت، مامۆستا) بە دروستی پڕ بکەرەوە!');
                return;
            }

            let allSchedules = JSON.parse(localStorage.getItem('schoolBoxSchedulesCustomTime')) || [];
            allSchedules.push({ grade, section, day, time, subject, teacher });
            localStorage.setItem('schoolBoxSchedulesCustomTime', JSON.stringify(allSchedules));

            document.getElementById('scheduleTime').value = '';
            document.getElementById('scheduleSubject').value = '';
            document.getElementById('scheduleTeacher').value = '';
            alert('✅ وانەکە بە کاتی دڵخواز بۆ خشتەی ڕۆژەکە زیاد کرا!');
            loadScheduleBoxes(grade, section);
        }

        function loadScheduleBoxes(grade, section) {
            let container = document.getElementById('daysContainer');
            let allSchedules = JSON.parse(localStorage.getItem('schoolBoxSchedulesCustomTime')) || [];
            
            let filtered = allSchedules.filter(item => item.grade === grade && item.section === section);
            let days = ["شەممە", "یەکشەممە", "دووشەممە", "سێشەممە", "چوارشەممە", "پێنجشەممە"];
            
            container.innerHTML = days.map(day => {
                let dayLessons = filtered.filter(item => item.day === day);
                
                let lessonsHtml = dayLessons.length > 0 ? dayLessons.map((l) => `
                    <div class="lesson-item">
                        <div class="lesson-info">
                            <span class="lesson-time">⏱️ ${l.time}</span>
                            <span><b>${l.subject}</b> (${l.teacher})</span>
                        </div>
                        ${localStorage.getItem('currentUserRole') === 'admin' ? `<button class="delete-btn" onclick="deleteBoxItem('${l.subject}', '${l.time}', '${l.day}')">سڕینەوە</button>` : ''}
                    </div>
                `).join('') : `<p style="font-size: 11px; color: #cbd5e1; text-align: center; padding: 10px;">هیچ وانەیەک تۆمار نەکراوە</p>`;

                return `
                    <div class="day-box">
                        <h3>📅 ${day}</h3>
                        <div>${lessonsHtml}</div>
                    </div>
                `;
            }).join('');
        }

        function loadScheduleBoxesForTeacher() {
            let container = document.getElementById('daysContainer');
            let allSchedules = JSON.parse(localStorage.getItem('schoolBoxSchedulesCustomTime')) || [];
            let teacherName = prompt("تکایە ناوی خۆت وەک مامۆستا بنووسە بۆ بینینی خشتەکەت:") || "";

            let filtered = allSchedules.filter(item => item.teacher.includes(teacherName));
            let days = ["شەممە", "یەکشەممە", "دووشەممە", "سێشەممە", "چوارشەممە", "پێنجشەممە"];
            
            container.innerHTML = days.map(day => {
                let dayLessons = filtered.filter(item => item.day === day);
                let lessonsHtml = dayLessons.length > 0 ? dayLessons.map(l => `
                    <div class="lesson-item">
                        <div class="lesson-info">
                            <span class="lesson-time">⏱️ ${l.time}</span>
                            <span><b>${l.subject}</b> - ${l.grade} (${l.section})</span>
                        </div>
                    </div>
                `).join('') : `<p style="font-size: 11px; color: #cbd5e1; text-align: center; padding: 10px;">پشوو / هیچ وانەیەک نییە</p>`;

                return `
                    <div class="day-box">
                        <h3>📅 ${day}</h3>
                        <div>${lessonsHtml}</div>
                    </div>
                `;
            }).join('');
        }

        function deleteBoxItem(subject, time, day) {
            let allSchedules = JSON.parse(localStorage.getItem('schoolBoxSchedulesCustomTime')) || [];
            let updated = allSchedules.filter(item => !(item.subject === subject && item.time === time && item.day === day));
            localStorage.setItem('schoolBoxSchedulesCustomTime', JSON.stringify(updated));
            loadScheduleBoxes("پۆلی 12 (زانستی)", "لقی أ");
        }
    </script>
</body>
</html>
