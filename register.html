<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تۆمارکردن - ئامادەیی بەدرخانی کوڕان</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(10, 40, 50, 0.7), rgba(10, 30, 40, 0.8)), url('school.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 15px;
        }

        .glass-card {
            background: rgba(20, 60, 75, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            color: white;
        }

        .glass-card h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #e5e7eb;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 15px;
            font-size: 14px;
            color: white;
            outline: none;
        }

        .input-group input::placeholder {
            color: #d1d5db;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2dd4bf 0%, #0ea5e9 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 10px 20px rgba(14, 165, 233, 0.3);
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .login-link {
            margin-top: 20px;
            font-size: 13px;
            color: #d1d5db;
        }

        .login-link a {
            color: #38bdf8;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h2>تۆمارکردنی هەژمار</h2>

        <form action="page1.html" method="GET">
            <div class="input-group">
                <label>ناوی تەواوی قوتابی</label>
                <input type="text" placeholder="ناوی سیانی" required>
            </div>

            <div class="input-group">
                <label>پۆل / قۆناغی خوێندن</label>
                <input type="text" placeholder="نموونە: پۆلی 12" required>
            </div>

            <div class="input-group">
                <label>وشەی تێپەڕ</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="submit-btn">تۆمارکردن</button>
        </form>

        <div class="login-link">
            هەژمارت هەیە؟ <a href="index.html">چوونەژوورەوە</a>
        </div>
    </div>

</body>
</html>
